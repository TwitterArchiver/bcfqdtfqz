  他阳痿的时候，是我最爱他的时候，他会让我等一等，别着急。他在药效发作前会给我读聂鲁达的诗，给我讲封神榜，告诉我玉皇大帝和王母娘娘不是一家人，告诉我希腊神话的故事，给我讲世界地图，告诉我未来世界已经没有了水整个都是冰冻。在药效发作前，我想他是爱我的，是把我放在眼睛里的。药效发作一般要40分钟，故事讲完了也没开始，我们又开始聊摇滚乐，从英伦摇滚谈到日本摇滚，再到中国摇滚。时间还没到，再聊民谣，马頔宋冬野到左小姐，时间还没到我们再聊艺术，从当代艺术到先锋艺术，从巴洛克聊到文艺复兴。养胃真是男人的福报，在等药效的时候，我看到了这个世界男人应该有的样子。
